<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══ LOGIN SCREEN ══ -->
<div id="loginScreen" style="display:none">
  <div class="login-bg">
    <div class="login-card">
      <div class="login-title">Character <span>Bible</span></div>
      <div class="login-subtitle">База знаний для писателей</div>
      <div class="form-group" style="margin-top:2rem">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="login-email" placeholder="your@email.com" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-input" id="login-password" placeholder="••••••••">
      </div>
      <div id="loginError" style="color:#c0392b;font-size:13px;margin-top:-4px;margin-bottom:8px;min-height:18px"></div>
      <button class="btn-save" id="loginBtn" onclick="login()" style="width:100%;padding:10px;font-size:15px">Войти</button>
    </div>
  </div>
</div>

<!-- ══ MAIN APP ══ -->
<div class="app" id="app" style="display:none">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-title">Character <span>Bible</span></div>
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" class="topbar-search" placeholder="Поиск..." id="searchInput" oninput="filterChars()">
    </div>
    <select class="book-filter" id="bookFilter" onchange="filterByBook(this.value)">
      <option value="">Все книги</option>
    </select>
    <button class="topbar-btn" onclick="showAddModal()">
      <i class="ti ti-user-plus"></i> Добавить
    </button>
    <button class="topbar-btn-ghost" onclick="logout()" title="Выйти">
      <i class="ti ti-logout"></i>
    </button>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Навигация</div>
      <div class="sidebar-item active" onclick="showView('all')" id="nav-all">
        <i class="ti ti-users"></i> Все персонажи
      </div>
      <div class="sidebar-item" onclick="showView('relations')" id="nav-relations">
        <i class="ti ti-topology-star"></i> Карта связей
      </div>
    </div>
    <div class="sidebar-sep"></div>
    <div class="sidebar-section">
      <div class="sidebar-label">Персонажи</div>
      <div id="sidebar-chars"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main" id="main">
    <div id="view-loading" class="loading-screen">
      <div class="loading-spinner"></div>
      <p>Загрузка...</p>
    </div>

    <div id="view-all" style="display:none">
      <div class="page-header">
        <div>
          <div class="page-title">Персонажи</div>
          <div class="page-subtitle" id="char-count-label">0 персонажей</div>
        </div>
      </div>
      <div class="char-grid" id="charGrid"></div>
    </div>

    <div id="view-detail" style="display:none">
      <div class="back-btn" onclick="goBack()">
        <i class="ti ti-arrow-left"></i> Назад
      </div>
      <div id="detailContent"></div>
    </div>

    <div id="view-relations" style="display:none">
      <div class="page-header">
        <div>
          <div class="page-title">Карта связей</div>
          <div class="page-subtitle">Отношения между персонажами</div>
        </div>
      </div>
      <div id="relMapContent"></div>
    </div>
  </div>
</div>

<!-- ADD/EDIT CHARACTER MODAL -->
<div id="addModal" class="modal-bg" style="display:none" onclick="closeModalBg(event,'addModal')">
  <div class="modal">
    <h2 id="modalTitle">Новый персонаж</h2>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Имя *</label>
        <input type="text" class="form-input" id="f-name" placeholder="Имя персонажа">
      </div>
      <div class="form-group">
        <label class="form-label">Роль</label>
        <select class="form-input" id="f-role">
          <option>Главный герой</option>
          <option>Второстепенный</option>
          <option>Антагонист</option>
          <option>Союзник</option>
          <option>Наставник</option>
          <option>Другое</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Возраст</label>
        <input type="text" class="form-input" id="f-age" placeholder="25">
      </div>
      <div class="form-group">
        <label class="form-label">Книга</label>
        <input type="text" class="form-input" id="f-book" placeholder="Книга 1">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Внешность</label>
      <textarea class="form-input form-textarea" id="f-appearance" placeholder="Рост, цвет волос, глаз, особые черты..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Характер</label>
      <textarea class="form-input form-textarea" id="f-personality" placeholder="Черты характера, привычки, странности..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Биография</label>
      <textarea class="form-input form-textarea" id="f-bio" placeholder="Предыстория, ключевые события..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Теги (через запятую)</label>
        <input type="text" class="form-input" id="f-tags" placeholder="маг, воин, загадочный">
      </div>
      <div class="form-group">
        <label class="form-label">Эмодзи</label>
        <input type="text" class="form-input" id="f-emoji" placeholder="🧙">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideModal('addModal')">Отмена</button>
      <button class="btn-save" id="saveCharBtn" onclick="saveChar()">
        <span id="saveBtnText">Сохранить</span>
      </button>
    </div>
  </div>
</div>

<!-- ADD RELATION MODAL -->
<div id="relModal" class="modal-bg" style="display:none" onclick="closeModalBg(event,'relModal')">
  <div class="modal">
    <h2>Добавить связь</h2>
    <div class="form-group">
      <label class="form-label">Персонаж</label>
      <select class="form-input" id="rel-target"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Тип отношений</label>
      <select class="form-input" id="rel-type">
        <option>Друзья</option>
        <option>Враги</option>
        <option>Влюблённые</option>
        <option>Родственники</option>
        <option>Союзники</option>
        <option>Наставник / Ученик</option>
        <option>Соперники</option>
        <option>Нейтральные</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Описание</label>
      <textarea class="form-input form-textarea" id="rel-desc" placeholder="Как сложились отношения..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideModal('relModal')">Отмена</button>
      <button class="btn-save" onclick="saveRel()">Добавить</button>
    </div>
  </div>
</div>

<!-- IMAGE MODAL -->
<div id="imgModal" class="modal-bg" style="display:none" onclick="closeModalBg(event,'imgModal')">
  <div class="modal">
    <h2>Загрузить изображение</h2>
    <div class="form-group">
      <label class="form-label">Эмоция</label>
      <select class="form-input" id="img-emotion">
        <option>Нейтральное</option>
        <option>Радость</option>
        <option>Гнев</option>
        <option>Грусть</option>
        <option>Страх</option>
        <option>Удивление</option>
        <option>Решимость</option>
        <option>Другое</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Изображение</label>
      <div class="upload-area" onclick="document.getElementById('imgFileInput').click()">
        <i class="ti ti-photo-up"></i>
        <p>Нажми чтобы выбрать файл</p>
        <p style="font-size:11px;margin-top:4px;opacity:0.6">JPG, PNG, WEBP · до 5 МБ</p>
      </div>
      <input type="file" id="imgFileInput" accept="image/*" style="display:none" onchange="previewImage(event)">
      <img id="imgPreview" style="display:none;width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:10px" alt="">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="hideModal('imgModal')">Отмена</button>
      <button class="btn-save" onclick="uploadImage()">
        <span id="uploadBtnText">Загрузить</span>
      </button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" style="display:none" onclick="closeLightbox()">
  <span class="lightbox-close"><i class="ti ti-x"></i></span>
  <img id="lbImg" src="" alt="">
</div>

<!-- TOAST -->
<div id="toast" class="toast" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
